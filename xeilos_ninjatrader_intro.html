<style>
  :root{
    --red:#E11D2E; --bg:#0B0909; --cream:#F2ECE4; --mute:rgba(242,236,228,.62); --faint:rgba(242,236,228,.36);
    --line:rgba(242,236,228,.16); --panel:rgba(14,11,11,.82);
    --serif:'Cinzel',Georgia,serif; --ital:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:100%;height:100%;overflow:hidden;background:transparent}
  body{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--cream);font-family:var(--body);transform-origin:0 0}
  section{position:absolute;inset:0;display:none}
  body[data-scene="debut"] #debut,body[data-scene="live"] #live{display:block}
  @keyframes pulse{50%{opacity:.25}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes heartbeat{
    0%,40%,100%{transform:translate(-50%,-50%) scale(1);border-color:rgba(225,29,46,.45);box-shadow:0 0 40px rgba(225,29,46,.18),inset 0 0 40px rgba(225,29,46,.12)}
    10%{transform:translate(-50%,-50%) scale(1.045);border-color:rgba(255,60,75,.95);box-shadow:0 0 70px rgba(225,29,46,.55),inset 0 0 60px rgba(225,29,46,.3)}
    20%{transform:translate(-50%,-50%) scale(1.01)}
    28%{transform:translate(-50%,-50%) scale(1.03);border-color:rgba(255,60,75,.8);box-shadow:0 0 55px rgba(225,29,46,.4),inset 0 0 50px rgba(225,29,46,.22)}
  }
  @keyframes wave{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}70%,100%{transform:translate(-50%,-50%) scale(1.32);opacity:0}}
  @keyframes glowbeat{0%,40%,100%{opacity:.55;transform:scale(1)}10%{opacity:1;transform:scale(1.06)}28%{opacity:.85;transform:scale(1.03)}}

  /* ================= 1. DÉBUT (v2) ================= */
  #debut{background:radial-gradient(1100px 700px at 85% 15%,rgba(255,72,0,.10),transparent 60%),radial-gradient(1000px 800px at 10% 100%,rgba(225,29,46,.18),transparent 65%),#080707}
  #debut .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(242,236,228,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,236,228,.05) 1px,transparent 1px);background-size:80px 80px;-webkit-mask:linear-gradient(180deg,transparent,#000 20%,#000 75%,transparent);mask:linear-gradient(180deg,transparent,#000 20%,#000 75%,transparent)}
  #debut .chart{position:absolute;left:0;right:0;bottom:120px;width:1920px;height:520px;opacity:.55}
  #debut .chart .c{opacity:0;animation:candle .5s ease forwards}
  @keyframes candle{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
  #debut .chart path{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 9s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #debut .haze{position:absolute;inset:0;background:linear-gradient(90deg,#080707 0%,rgba(8,7,7,.85) 30%,rgba(8,7,7,.2) 60%,rgba(8,7,7,.6) 100%)}
  .hd{position:absolute;left:96px;right:96px;top:60px;display:flex;justify-content:space-between;align-items:center;animation:rise .8s ease both}
  .lock{display:flex;align-items:center;gap:16px}
  .lock .sphere{width:52px;height:52px}
  .lock b{font:600 30px/1 var(--serif);letter-spacing:.08em}
  .lock .x{font:500 32px/1 var(--ital);font-style:italic;color:var(--red)}
  .lock .ntinline .ic{width:54px;height:33px}.lock .ntinline .wm{width:184px;height:26px}
  .soon{display:flex;align-items:center;gap:12px;padding:12px 22px;border:1px solid var(--line);border-radius:40px;font:700 15px var(--body);letter-spacing:.3em;background:rgba(14,11,11,.6)}
  .soon b{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse 1.4s infinite}
  .hero{position:absolute;left:96px;top:250px;animation:rise .9s .1s ease both}
  .eyebrow{display:flex;align-items:center;gap:14px;font:600 18px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
  .eyebrow span{width:46px;height:2px;background:linear-gradient(90deg,var(--red),#FF4800)}
  .eyebrow .ntwm{width:150px;height:21px}
  .hero h1{font:600 124px/.98 var(--serif);letter-spacing:.02em;margin-top:28px;text-transform:uppercase;background:linear-gradient(180deg,#fff 30%,#d9cfc4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 40px rgba(225,29,46,.25))}
  .hero .sub{font:500 40px var(--ital);font-style:italic;color:var(--mute);margin-top:26px}

  .clock{position:absolute;right:96px;top:330px;width:640px;padding:38px 40px 34px;background:rgba(14,11,11,.72);border:1px solid var(--line);border-top:3px solid;border-image:linear-gradient(90deg,var(--red),#FF4800) 1;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rise .9s .2s ease both}
  .clock .lbl{font:600 15px var(--body);letter-spacing:.38em;color:var(--mute);text-transform:uppercase}
  .boxes{display:flex;align-items:flex-start;justify-content:space-between;margin-top:26px}
  .boxes .bx{width:160px;text-align:center}
  .boxes .bx b{display:block;padding:20px 0 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font:600 84px/1 var(--serif);font-variant-numeric:tabular-nums}
  .boxes .bx small{display:block;margin-top:12px;font:600 12px var(--body);letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .boxes i{font:600 60px/1 var(--serif);color:var(--red);font-style:normal;margin-top:30px;animation:pulse 1s steps(1) infinite}
  .go{display:none;font:600 70px/1.4 var(--serif);text-align:center;margin-top:20px}
  .clock.done .boxes{display:none}.clock.done .go{display:block}
  .ticker{position:absolute;left:0;right:0;bottom:62px;height:58px;overflow:hidden;background:rgba(14,11,11,.8);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ticker .track{display:flex;width:max-content;height:100%;align-items:center;animation:tick 40s linear infinite}
  .ticker span{display:flex;align-items:center;gap:18px;padding:0 34px;font:600 19px var(--body);letter-spacing:.24em;color:var(--cream);white-space:nowrap}
  .ticker span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:34px}
  @keyframes tick{to{transform:translateX(-50%)}}
  .riskline{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:14px;color:var(--faint)}

  /* ================= 2. LIVE ================= */
  .panel{background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .topleft{position:absolute;left:0;top:0;display:flex;align-items:stretch;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .topleft .brand{display:flex;align-items:center;gap:14px;padding:14px 24px;border-right:1px solid var(--line)}
  .topleft .brand .sphere{width:42px;height:42px}
  .topleft .brand b{font:600 24px/1 var(--serif);letter-spacing:.08em}

  .topleft .title{padding:14px 26px;display:flex;flex-direction:column;justify-content:center;font:600 22px var(--serif);letter-spacing:.06em}
  .topleft .title small{font:500 13px var(--body);letter-spacing:.34em;color:var(--mute);margin-bottom:6px;text-transform:uppercase}
  .liveb{position:absolute;right:0;top:0;display:flex;align-items:center;gap:12px;padding:0 24px;height:58px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font:700 15px var(--body);letter-spacing:.3em}
  .liveb b{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse 1.4s infinite}
  .liveb #clock{font:600 17px var(--body);letter-spacing:.02em;color:var(--mute);padding-left:14px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
  #live .risk{position:absolute;right:0;bottom:0;padding:15px 26px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:15px;color:var(--mute)}
  #live .powered{position:absolute;left:0;bottom:0;padding:14px 26px;border-top:1px solid var(--red);border-right:1px solid var(--line);font-size:19px}

<body data-scene="debut">

<section id="debut">
  <div class="grid"></div>
  <svg class="chart" viewBox="0 0 1920 520" preserveAspectRatio="none"></svg>
  <div class="haze"></div>
  <header class="hd">
    <div class="lock"><span class="sphere"></span><b>XEILOS</b><span class="x">×</span><span class="ntinline"><i class="ic"></i><i class="wm"></i></span></div>
    <div class="soon"><b></b>BIENTÔT EN DIRECT</div>
  </header>
  <div class="hero">
    <div class="eyebrow"><span></span>Présentation de la plateforme</div>
    <h1>Découvre<br>NinjaTrader</h1>
    <p class="sub" data-titre>Prise en main et fonctionnalités clés, en direct</p>
  </div>
  <div class="ntbig"></div>
  <div class="ticker"><div class="track" id="track"></div></div>
  <div class="riskline" data-risk></div>
</section>

<section id="live">
  <div class="topleft panel">
    <div class="brand"><span class="sphere"></span><b>XEILOS</b><span class="x">×</span><span class="ntinline"><i class="ic"></i><i class="wm"></i></span></div>
    <div class="title"><small>Présentation plateforme</small><span data-titre>Découverte de NinjaTrader</span></div>
  </div>
  <div class="liveb panel"><b></b>EN DIRECT<span id="clock">--:--</span></div>
  <div class="powered panel">Plateforme présentée : <i class="ntwm"></i></div>
  <div class="risk panel" data-risk></div>
</section>

<script>
(function(){
  function fit(){
    var w=innerWidth,h=innerHeight,k=Math.min(w/1920,h/1080);
    document.body.style.transform=(w===1920&&h===1080)?'':'translate('+((w-1920*k)/2)+'px,'+((h-1080*k)/2)+'px) scale('+k+')';
  }
  fit(); addEventListener('resize',fit);

  var q=new URLSearchParams(location.search);
  var scene='debut';
  document.body.dataset.scene=scene;
  if(q.get('demo')) document.body.classList.add('demo');
  var RISK="Le trading comporte un risque élevé de perte en capital. Contenu éducatif, pas un conseil en investissement.";
  document.querySelectorAll('[data-risk]').forEach(function(e){e.textContent=RISK;});
  if(q.get('titre')) document.querySelectorAll('[data-titre]').forEach(function(e){e.textContent=q.get('titre');});

  if(scene==='debut'){
    // bandeau des marchés
    var M=['DAX 40','NASDAQ 100','S&P 500','DOW JONES','OR','PÉTROLE','EUR/USD','BITCOIN'],h='';
    for(var k=0;k<4;k++) M.forEach(function(x){h+='<span>'+x+'</span>';});
    document.getElementById('track').innerHTML=h;
    // graphique en chandeliers décoratif
    var svg=document.querySelector('#debut .chart'),seed=11,rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647;};
    var n=64,w=1920/n,p=420,o='',line='M';
    for(var i=0;i<n;i++){var op=p,cl=Math.max(70,Math.min(470,op+(rnd()-.6)*52)),hi=Math.min(op,cl)-rnd()*24,lo=Math.max(op,cl)+rnd()*24,up=cl<op,col=up?'#F2ECE4':'#E11D2E',x=i*w+w*.3;
      o+='<g class="c" style="animation-delay:'+(i*0.06).toFixed(2)+'s;transform-origin:'+(x+w*.2)+'px '+((op+cl)/2)+'px"><line x1="'+(x+w*.2)+'" x2="'+(x+w*.2)+'" y1="'+hi+'" y2="'+lo+'" stroke="'+col+'" stroke-width="1.5"/><rect x="'+x+'" y="'+Math.min(op,cl)+'" width="'+(w*.4)+'" height="'+Math.max(3,Math.abs(cl-op))+'" fill="'+col+'"/></g>';
      line+=(i?' L':'')+(x+w*.2).toFixed(0)+' '+cl.toFixed(0);p=cl;}
    svg.innerHTML='<defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#E11D2E"/><stop offset="1" stop-color="#FF4800"/></linearGradient></defs>'+o+'<path d="'+line+'" fill="none" stroke="url(#lg)" stroke-width="3" opacity=".9"/>';
  }
  if(scene==='live'){
    var ck=document.getElementById('clock');
    (function t(){ck.textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});setTimeout(t,5000);})();
  }
})();
</script>
</body>
