<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Xeilos – Command Center Macro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Barlow Condensed',sans-serif; }
:root {
  --red:#A61820; --gold:#D4AF37; --gold-text:#F0C24C; --cyan:#3ED9E8; --dark:#07070A;
}

/* ============ TOP BAR — HUD panel ============ */
#topbar {
  position:absolute; top:0; left:0; right:0; height:68px;
  background:rgba(7,7,10,0.96);
  clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - 26px) 100%, 0 100%);
  border-bottom:2px solid var(--cyan);
  display:flex; align-items:center; padding:0 30px; z-index:300;
}
#brand-logo { height:36px; width:auto; object-fit:contain; margin-right:20px; }
.live-badge { display:flex; align-items:center; gap:7px; padding:5px 14px; background:var(--red); clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px); }
.live-dot { width:7px; height:7px; border-radius:50%; background:#FFF; animation:blink 1.4s ease-in-out infinite; }
.live-text { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:3px; color:#FFF; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

.scene-tag {
  margin-left:20px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500;
  letter-spacing:2px; color:var(--cyan); text-transform:uppercase;
  padding:4px 12px; border:1px solid rgba(62,217,232,0.4); background:rgba(62,217,232,0.06);
}

/* market sessions */
#sessions { display:flex; align-items:center; gap:16px; margin-left:36px; }
.session { display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1px; color:rgba(255,255,255,0.5); }
.session .dot { width:6px; height:6px; border-radius:50%; }
.dot.open { background:#3EE87A; box-shadow:0 0 8px #3EE87A; }
.dot.closed { background:rgba(255,255,255,0.25); }

#clock { font-family:'IBM Plex Mono',monospace; font-size:22px; color:#FFF; letter-spacing:2px; margin-left:auto; }
#date-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1.5px; margin-left:14px; }

/* ============ HUD corner brackets (reusable) ============ */
.hud-corner { position:absolute; width:26px; height:26px; z-index:120; pointer-events:none; }
.hud-corner.tl { top:10px; left:10px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
.hud-corner.tr { top:10px; right:10px; border-top:2px solid var(--accent); border-right:2px solid var(--accent); }
.hud-corner.bl { bottom:10px; left:10px; border-bottom:2px solid var(--accent); border-left:2px solid var(--accent); }
.hud-corner.br { bottom:10px; right:10px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }

/* ============ ECRAN — zone gauche ============ */
#screen-zone {
  position:absolute; left:0; top:68px; bottom:50px;
  width:1350px; background:transparent; z-index:50;
  --accent: var(--gold);
}
#screen-zone .tag {
  position:absolute; top:18px; left:18px; z-index:60;
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:var(--gold-text);
  padding:5px 12px; background:rgba(7,7,10,0.75); border:1px solid rgba(212,175,55,0.4);
}
#screen-zone .rec {
  position:absolute; top:18px; right:18px; z-index:60;
  display:flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--red);
  padding:5px 12px; background:rgba(7,7,10,0.75); border:1px solid rgba(166,24,32,0.4);
}
#screen-zone .rec .dot { width:6px; height:6px; border-radius:50%; background:var(--red); animation:blink 1s ease-in-out infinite; }

/* ============ WEBCAM — zone droite ============ */
#webcam-zone {
  position:absolute; right:0; top:68px; bottom:50px;
  width:570px; background:transparent; z-index:100;
  --accent: var(--cyan);
}
#webcam-zone .tag {
  position:absolute; bottom:18px; left:18px; z-index:110;
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:var(--cyan);
  padding:5px 12px; background:rgba(7,7,10,0.75); border:1px solid rgba(62,217,232,0.4);
}

/* ============ TICKER — bandeau bas HUD ============ */
#ticker-bar {
  position:absolute; left:0; right:0; bottom:0; height:50px;
  background:rgba(7,7,10,0.97);
  clip-path: polygon(26px 0, 100% 0, 100% 100%, 0 100%, 0 30%);
  border-top:2px solid var(--gold);
  z-index:200; display:flex; align-items:center; overflow:hidden;
}
#ticker-bar .ticker-tag {
  flex-shrink:0; height:100%; width:150px;
  background:var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:2px; color:#FFF;
  box-shadow:4px 0 24px rgba(166,24,32,0.45); z-index:2;
}
.eq-bars { display:flex; align-items:flex-end; gap:3px; height:16px; }
.eq-bars span { width:3px; background:#FFF; animation:eq 0.9s ease-in-out infinite; }
.eq-bars span:nth-child(1){height:40%; animation-delay:0s;}
.eq-bars span:nth-child(2){height:100%; animation-delay:0.15s;}
.eq-bars span:nth-child(3){height:60%; animation-delay:0.3s;}
.eq-bars span:nth-child(4){height:85%; animation-delay:0.45s;}
@keyframes eq { 0%,100%{transform:scaleY(0.4);} 50%{transform:scaleY(1);} }

#ticker-widget-wrap { flex:1; height:100%; }
.tradingview-widget-container { height:100%; width:100%; }

/* ============ grid texture overlay (subtle HUD feel) ============ */
#grid-overlay {
  position:absolute; top:68px; left:0; width:1350px; bottom:50px;
  background-image:
    linear-gradient(rgba(62,217,232,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,217,232,0.03) 1px, transparent 1px);
  background-size:48px 48px;
  z-index:10; pointer-events:none;
}
</style>
</head>

<script>
const pad = v => String(v).padStart(2,'0');
const jours = ["DIM","LUN","MAR","MER","JEU","VEN","SAM"];
const mois = ["JANV","FÉVR","MARS","AVR","MAI","JUIN","JUIL","AOÛT","SEPT","OCT","NOV","DÉC"];
function tick(){
  const n = new Date();
  document.getElementById('clock').textContent = pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  document.querySelector('[data-role="date"]').textContent = jours[n.getDay()]+' '+n.getDate()+' '+mois[n.getMonth()];
}
setInterval(tick,1000); tick();
</script>
